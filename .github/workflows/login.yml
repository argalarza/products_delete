name: 🚀 Build & Deploy Delete Product Service to EC2

on:
  push:
    branches:
      - test

jobs:
  build-and-deploy:
    name: 🐳 Build & Push Docker Image + ☁️ Deploy to EC2...
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🛠️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🐳 Build and Push Docker image
        run: |
          echo "🚧 Construyendo imagen..."
          docker build -t agente47/delete-product-service:latest .
          echo "📤 Subiendo imagen a Docker Hub..."
          docker push agente47/delete-product-service:latest

      - name: ☁️ Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "🛠️ Instalando Docker y Docker Compose si no existen..."
            if ! command -v docker &> /dev/null; then
              sudo yum update -y
              sudo yum install -y docker
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker ec2-user
            fi

            echo "⚙️ Configurando variables de entorno..."
            cat <<EOF | sudo tee /home/ec2-user/.env.delete-product-service
            MONGO_URI=mongodb://serious:123456@23.20.252.222:27017/products_db?authSource=admin
            DB_NAME=products_db
            JWT_SECRET=mysecretkey1234
            EOF

            echo "📦 Desplegando contenedor..."
            sudo docker pull agente47/delete-product-service:latest
            sudo docker network inspect my_global_network >/dev/null 2>&1 || \
              sudo docker network create my_global_network
            sudo docker stop delete-product-service || true
            sudo docker rm delete-product-service || true
            sudo docker run -d --name delete-product-service \
              --env-file /home/ec2-user/.env.delete-product-service \
              -p 4009:4009 \
              --network my_global_network \
              agente47/delete-product-service:latest
